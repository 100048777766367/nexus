name: Nexus Omni-Convergence Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '45 */4 * * *'

permissions:
  contents: write

jobs:
  run-nexus-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Nexus qua Linux Shell
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Vận hành Trục Hội Tụ Nexus
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python engine.py

      - name: Lưu vết tích nhịp đập hội tụ vào Git
        run: |
          git config --global user.name "Nexus-Omni-Bot"
          git config --global user.email "bot@nexus.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_backward.json synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🌌 [Nexus Omni-Hub] Nhịp đập hội tụ toàn mạng #(1+N) [skip ci]"
            git push origin main
          else
            echo "Mạng lưới tĩnh lặng, không có biến thiên mới."
          fi
